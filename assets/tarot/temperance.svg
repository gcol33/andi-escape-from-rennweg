<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 200">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#2d1b4e"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffec80"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <linearGradient id="rainbow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#ff6b6b"/>
      <stop offset="25%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#4ecdc4"/>
      <stop offset="75%" style="stop-color:#45b7d1"/>
      <stop offset="100%" style="stop-color:#9370db"/>
    </linearGradient>
  </defs>

  <!-- Card base -->
  <rect x="2" y="2" width="136" height="196" rx="8" fill="url(#cardBg)" stroke="url(#gold)" stroke-width="2"/>

  <!-- Decorative border -->
  <rect x="8" y="8" width="124" height="184" rx="4" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>

  <!-- Card title -->
  <text x="70" y="25" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-size="11" font-weight="bold">TEMPERANCE</text>

  <!-- Roman numeral -->
  <text x="70" y="38" text-anchor="middle" fill="#9370db" font-family="Georgia, serif" font-size="9" opacity="0.8">XIV</text>

  <!-- Main illustration area -->
  <rect x="20" y="45" width="100" height="110" rx="3" fill="#0d0520" stroke="url(#gold)" stroke-width="0.5" opacity="0.8"/>

  <!-- Temperance illustration -->
  <g transform="translate(70, 95)">
    <!-- Background sun rays -->
    <g stroke="url(#gold)" stroke-width="0.5" opacity="0.3">
      <line x1="0" y1="-50" x2="0" y2="-35"/>
      <line x1="15" y1="-48" x2="10" y2="-35"/>
      <line x1="-15" y1="-48" x2="-10" y2="-35"/>
      <line x1="28" y1="-42" x2="18" y2="-32"/>
      <line x1="-28" y1="-42" x2="-18" y2="-32"/>
    </g>

    <!-- Path with water -->
    <path d="M -40,45 Q -20,35 0,40 Q 20,45 40,35"
          fill="none" stroke="#4169e1" stroke-width="3" opacity="0.5"/>

    <!-- Mountains in distance -->
    <polygon points="-35,25 -20,0 -5,25" fill="#3a2a5a" opacity="0.4"/>
    <polygon points="5,25 25,-5 40,25" fill="#3a2a5a" opacity="0.3"/>

    <!-- Angel figure -->
    <!-- Wings -->
    <path d="M -8,-10 Q -35,-20 -40,-5 Q -35,5 -15,0 Q -10,-5 -8,-10" fill="#e8e8ff" opacity="0.7"/>
    <path d="M 8,-10 Q 35,-20 40,-5 Q 35,5 15,0 Q 10,-5 8,-10" fill="#e8e8ff" opacity="0.7"/>
    <!-- Wing details -->
    <path d="M -10,-8 Q -25,-12 -30,-5" fill="none" stroke="#c0c0ff" stroke-width="0.5" opacity="0.5"/>
    <path d="M 10,-8 Q 25,-12 30,-5" fill="none" stroke="#c0c0ff" stroke-width="0.5" opacity="0.5"/>

    <!-- Robe -->
    <path d="M -12,40 L -15,5 Q -15,-10 0,-15 Q 15,-10 15,5 L 12,40" fill="#fff" opacity="0.9"/>
    <path d="M -8,40 L -10,10 Q -8,0 0,-5 Q 8,0 10,10 L 8,40" fill="#87ceeb" opacity="0.3"/>

    <!-- Triangle on robe -->
    <polygon points="0,5 -6,18 6,18" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>

    <!-- Head with halo -->
    <circle cx="0" cy="-25" r="12" fill="url(#gold)" opacity="0.3"/>
    <circle cx="0" cy="-25" r="8" fill="#deb887"/>

    <!-- Hair -->
    <ellipse cx="0" cy="-30" rx="7" ry="4" fill="#ffd700" opacity="0.6"/>

    <!-- Face -->
    <circle cx="-2" cy="-26" r="1" fill="#4a3a3a"/>
    <circle cx="2" cy="-26" r="1" fill="#4a3a3a"/>
    <path d="M -2,-22 Q 0,-20 2,-22" fill="none" stroke="#c19a6b" stroke-width="0.5"/>

    <!-- Cups -->
    <g transform="translate(-18, 5)">
      <path d="M -5,0 L -3,-10 L 3,-10 L 5,0" fill="url(#gold)"/>
    </g>
    <g transform="translate(18, -5)">
      <path d="M -5,0 L -3,-10 L 3,-10 L 5,0" fill="url(#gold)"/>
    </g>

    <!-- Water flowing between cups -->
    <path d="M -13,-2 Q 0,10 13,-8" fill="none" stroke="url(#rainbow)" stroke-width="2" opacity="0.8"/>

    <!-- One foot in water, one on land -->
    <ellipse cx="-8" cy="42" rx="5" ry="3" fill="#4169e1" opacity="0.5"/>
    <ellipse cx="8" cy="40" rx="5" ry="3" fill="#228b22" opacity="0.4"/>

    <!-- Irises/flowers -->
    <g transform="translate(-30, 35)">
      <line x1="0" y1="0" x2="0" y2="10" stroke="#228b22" stroke-width="1"/>
      <ellipse cx="0" cy="-2" rx="2" ry="4" fill="#9370db" opacity="0.7"/>
    </g>
    <g transform="translate(30, 38)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="#228b22" stroke-width="1"/>
      <ellipse cx="0" cy="-2" rx="2" ry="4" fill="#9370db" opacity="0.7"/>
    </g>
  </g>

  <!-- Card meaning -->
  <text x="70" y="170" text-anchor="middle" fill="#b8a9c9" font-family="Georgia, serif" font-size="7" font-style="italic">Balance</text>
  <text x="70" y="180" text-anchor="middle" fill="#b8a9c9" font-family="Georgia, serif" font-size="7" font-style="italic">Harmony</text>

  <!-- Bottom decoration -->
  <text x="70" y="193" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-size="8" opacity="0.6">XIV</text>
</svg>
