<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 200">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#2d1b4e"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffec80"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <linearGradient id="sunGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff8dc"/>
      <stop offset="40%" style="stop-color:#ffd700"/>
      <stop offset="100%" style="stop-color:#ff8c00"/>
    </linearGradient>
  </defs>

  <!-- Card base -->
  <rect x="2" y="2" width="136" height="196" rx="8" fill="url(#cardBg)" stroke="url(#gold)" stroke-width="2"/>

  <!-- Decorative border -->
  <rect x="8" y="8" width="124" height="184" rx="4" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>

  <!-- Card title -->
  <text x="70" y="25" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-size="11" font-weight="bold">THE SUN</text>

  <!-- Roman numeral -->
  <text x="70" y="38" text-anchor="middle" fill="#9370db" font-family="Georgia, serif" font-size="9" opacity="0.8">XIX</text>

  <!-- Main illustration area -->
  <rect x="20" y="45" width="100" height="110" rx="3" fill="#0d0520" stroke="url(#gold)" stroke-width="0.5" opacity="0.8"/>

  <!-- Sun illustration -->
  <g transform="translate(70, 85)">
    <!-- Rays (wavy and straight alternating) -->
    <g stroke="#ffd700" stroke-width="2" fill="none" opacity="0.7">
      <line x1="0" y1="-40" x2="0" y2="-28"/>
      <path d="M 10,-38 Q 12,-33 10,-28"/>
      <line x1="20" y1="-35" x2="14" y2="-25"/>
      <path d="M 28,-28 Q 24,-25 22,-20"/>
      <line x1="35" y1="-20" x2="25" y2="-14"/>
      <path d="M 38,-10 Q 33,-10 28,-7"/>
      <line x1="40" y1="0" x2="28" y2="0"/>
      <path d="M 38,10 Q 33,10 28,7"/>
      <line x1="35" y1="20" x2="25" y2="14"/>
      <path d="M 28,28 Q 24,25 22,20"/>
      <line x1="20" y1="35" x2="14" y2="25"/>
      <path d="M 10,38 Q 12,33 10,28"/>
      <line x1="0" y1="40" x2="0" y2="28"/>
      <path d="M -10,38 Q -12,33 -10,28"/>
      <line x1="-20" y1="35" x2="-14" y2="25"/>
      <path d="M -28,28 Q -24,25 -22,20"/>
      <line x1="-35" y1="20" x2="-25" y2="14"/>
      <path d="M -38,10 Q -33,10 -28,7"/>
      <line x1="-40" y1="0" x2="-28" y2="0"/>
      <path d="M -38,-10 Q -33,-10 -28,-7"/>
      <line x1="-35" y1="-20" x2="-25" y2="-14"/>
      <path d="M -28,-28 Q -24,-25 -22,-20"/>
      <line x1="-20" y1="-35" x2="-14" y2="-25"/>
      <path d="M -10,-38 Q -12,-33 -10,-28"/>
    </g>

    <!-- Sun face -->
    <circle cx="0" cy="0" r="22" fill="#ffd700"/>
    <circle cx="0" cy="0" r="20" fill="#ffec80"/>

    <!-- Face features -->
    <circle cx="-7" cy="-3" r="2" fill="#cc9900"/>
    <circle cx="7" cy="-3" r="2" fill="#cc9900"/>
    <path d="M -8,6 Q 0,12 8,6" fill="none" stroke="#cc9900" stroke-width="2" stroke-linecap="round"/>

    <!-- Cheek blush -->
    <circle cx="-12" cy="3" r="3" fill="#ffb347" opacity="0.5"/>
    <circle cx="12" cy="3" r="3" fill="#ffb347" opacity="0.5"/>
  </g>

  <!-- Sunflowers at bottom -->
  <g transform="translate(70, 135)">
    <circle cx="-20" cy="0" r="6" fill="#ffd700"/>
    <circle cx="-20" cy="0" r="3" fill="#8b4513"/>
    <circle cx="0" cy="5" r="7" fill="#ffd700"/>
    <circle cx="0" cy="5" r="4" fill="#8b4513"/>
    <circle cx="20" cy="0" r="6" fill="#ffd700"/>
    <circle cx="20" cy="0" r="3" fill="#8b4513"/>
    <!-- Stems -->
    <line x1="-20" y1="6" x2="-20" y2="15" stroke="#228b22" stroke-width="2"/>
    <line x1="0" y1="12" x2="0" y2="20" stroke="#228b22" stroke-width="2"/>
    <line x1="20" y1="6" x2="20" y2="15" stroke="#228b22" stroke-width="2"/>
  </g>

  <!-- Card meaning -->
  <text x="70" y="170" text-anchor="middle" fill="#b8a9c9" font-family="Georgia, serif" font-size="7" font-style="italic">Joy</text>
  <text x="70" y="180" text-anchor="middle" fill="#b8a9c9" font-family="Georgia, serif" font-size="7" font-style="italic">Positivity</text>

  <!-- Bottom decoration -->
  <text x="70" y="193" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-size="8" opacity="0.6">XIX</text>
</svg>
