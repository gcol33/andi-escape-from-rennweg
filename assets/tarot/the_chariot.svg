<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 200">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#2d1b4e"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffec80"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
  </defs>

  <!-- Card base -->
  <rect x="2" y="2" width="136" height="196" rx="8" fill="url(#cardBg)" stroke="url(#gold)" stroke-width="2"/>

  <!-- Decorative border -->
  <rect x="8" y="8" width="124" height="184" rx="4" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>

  <!-- Card title -->
  <text x="70" y="25" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-size="11" font-weight="bold">THE CHARIOT</text>

  <!-- Roman numeral -->
  <text x="70" y="38" text-anchor="middle" fill="#9370db" font-family="Georgia, serif" font-size="9" opacity="0.8">VII</text>

  <!-- Main illustration area -->
  <rect x="20" y="45" width="100" height="110" rx="3" fill="#0d0520" stroke="url(#gold)" stroke-width="0.5" opacity="0.8"/>

  <!-- Chariot illustration -->
  <g transform="translate(70, 95)">
    <!-- Stars in sky -->
    <circle cx="-30" cy="-40" r="1" fill="#fff" opacity="0.5"/>
    <circle cx="25" cy="-35" r="1.5" fill="#fff" opacity="0.6"/>
    <circle cx="-15" cy="-45" r="1" fill="#fff" opacity="0.4"/>
    <circle cx="35" cy="-42" r="1" fill="#fff" opacity="0.5"/>

    <!-- Canopy -->
    <path d="M -30,-25 Q 0,-40 30,-25" fill="#1e3a5f" stroke="url(#gold)" stroke-width="1"/>
    <circle cx="-25" cy="-25" r="2" fill="url(#gold)"/>
    <circle cx="25" cy="-25" r="2" fill="url(#gold)"/>

    <!-- Stars on canopy -->
    <text x="-15" y="-30" fill="#fff" font-size="6" opacity="0.7">*</text>
    <text x="0" y="-33" fill="#fff" font-size="8" opacity="0.8">*</text>
    <text x="12" y="-30" fill="#fff" font-size="6" opacity="0.7">*</text>

    <!-- Chariot body -->
    <rect x="-25" y="-20" width="50" height="30" fill="#4a3a6a"/>
    <rect x="-25" y="-20" width="50" height="5" fill="url(#gold)" opacity="0.6"/>

    <!-- Winged emblem on chariot -->
    <circle cx="0" cy="-5" r="6" fill="url(#gold)" opacity="0.5"/>
    <path d="M -6,-5 Q -15,-10 -20,-5 Q -15,0 -6,-5" fill="url(#gold)" opacity="0.4"/>
    <path d="M 6,-5 Q 15,-10 20,-5 Q 15,0 6,-5" fill="url(#gold)" opacity="0.4"/>

    <!-- Charioteer -->
    <rect x="-8" y="-18" width="16" height="15" fill="#c0c0c0"/>
    <circle cx="0" cy="-25" r="7" fill="#deb887"/>
    <!-- Crown -->
    <path d="M -5,-30 L -3,-35 L 0,-32 L 3,-35 L 5,-30" fill="url(#gold)"/>
    <!-- Face -->
    <circle cx="-2" cy="-26" r="1" fill="#4a3a3a"/>
    <circle cx="2" cy="-26" r="1" fill="#4a3a3a"/>

    <!-- Wheels -->
    <circle cx="-30" cy="20" r="12" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="-30" cy="20" r="3" fill="url(#gold)"/>
    <line x1="-30" y1="8" x2="-30" y2="32" stroke="url(#gold)" stroke-width="1"/>
    <line x1="-42" y1="20" x2="-18" y2="20" stroke="url(#gold)" stroke-width="1"/>

    <circle cx="30" cy="20" r="12" fill="none" stroke="url(#gold)" stroke-width="2"/>
    <circle cx="30" cy="20" r="3" fill="url(#gold)"/>
    <line x1="30" y1="8" x2="30" y2="32" stroke="url(#gold)" stroke-width="1"/>
    <line x1="18" y1="20" x2="42" y2="20" stroke="url(#gold)" stroke-width="1"/>

    <!-- Sphinxes -->
    <!-- Black sphinx -->
    <ellipse cx="-25" cy="40" rx="10" ry="6" fill="#2a2a2a"/>
    <circle cx="-30" cy="35" r="5" fill="#2a2a2a"/>
    <path d="M -33,33 L -35,28 L -32,30" fill="#2a2a2a"/>

    <!-- White sphinx -->
    <ellipse cx="25" cy="40" rx="10" ry="6" fill="#e8e8e8"/>
    <circle cx="30" cy="35" r="5" fill="#e8e8e8"/>
    <path d="M 33,33 L 35,28 L 32,30" fill="#e8e8e8"/>
  </g>

  <!-- Card meaning -->
  <text x="70" y="170" text-anchor="middle" fill="#b8a9c9" font-family="Georgia, serif" font-size="7" font-style="italic">Determination</text>
  <text x="70" y="180" text-anchor="middle" fill="#b8a9c9" font-family="Georgia, serif" font-size="7" font-style="italic">Willpower</text>

  <!-- Bottom decoration -->
  <text x="70" y="193" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-size="8" opacity="0.6">VII</text>
</svg>
