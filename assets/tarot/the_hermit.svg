<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 200">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#2d1b4e"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffec80"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
    <radialGradient id="lanternGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#fff8dc"/>
      <stop offset="30%" style="stop-color:#ffd700;stop-opacity:0.8"/>
      <stop offset="100%" style="stop-color:#ffd700;stop-opacity:0"/>
    </radialGradient>
  </defs>

  <!-- Card base -->
  <rect x="2" y="2" width="136" height="196" rx="8" fill="url(#cardBg)" stroke="url(#gold)" stroke-width="2"/>

  <!-- Decorative border -->
  <rect x="8" y="8" width="124" height="184" rx="4" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>

  <!-- Card title -->
  <text x="70" y="25" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-size="11" font-weight="bold">THE HERMIT</text>

  <!-- Roman numeral -->
  <text x="70" y="38" text-anchor="middle" fill="#9370db" font-family="Georgia, serif" font-size="9" opacity="0.8">IX</text>

  <!-- Main illustration area -->
  <rect x="20" y="45" width="100" height="110" rx="3" fill="#0d0520" stroke="url(#gold)" stroke-width="0.5" opacity="0.8"/>

  <!-- Hermit illustration -->
  <g transform="translate(70, 100)">
    <!-- Mountain background -->
    <polygon points="-40,50 -20,10 0,30 20,5 40,50" fill="#2a1a4a" opacity="0.5"/>
    <polygon points="-30,50 -10,20 10,35 30,15 45,50" fill="#3a2a5a" opacity="0.4"/>

    <!-- Snow caps -->
    <polygon points="-20,10 -15,18 -25,18" fill="#e8e8e8" opacity="0.3"/>
    <polygon points="20,5 25,15 15,15" fill="#e8e8e8" opacity="0.3"/>

    <!-- Lantern glow -->
    <circle cx="-15" cy="-15" r="20" fill="url(#lanternGlow)"/>

    <!-- Robed figure -->
    <path d="M -10,45 Q -15,20 -5,0 Q 0,-5 5,0 Q 15,20 10,45" fill="#5a5a6a"/>

    <!-- Hood -->
    <ellipse cx="0" cy="-5" rx="10" ry="12" fill="#4a4a5a"/>
    <ellipse cx="0" cy="-8" rx="7" ry="8" fill="#3a3a4a"/>

    <!-- Face in shadow -->
    <ellipse cx="0" cy="-8" rx="5" ry="6" fill="#2a2a3a"/>

    <!-- Beard -->
    <path d="M -3,-2 Q 0,8 3,-2" fill="#c0c0c0" opacity="0.6"/>

    <!-- Staff -->
    <line x1="12" y1="-20" x2="12" y2="45" stroke="#8b7355" stroke-width="3"/>
    <line x1="12" y1="-20" x2="12" y2="45" stroke="#a08060" stroke-width="2"/>

    <!-- Lantern -->
    <rect x="-20" y="-25" width="10" height="15" fill="none" stroke="url(#gold)" stroke-width="1"/>
    <line x1="-15" y1="-25" x2="-15" y2="-30" stroke="url(#gold)" stroke-width="1"/>
    <circle cx="-15" cy="-17" r="3" fill="#ffd700"/>

    <!-- Six-pointed star in lantern -->
    <polygon points="-15,-20 -13,-16 -17,-16" fill="url(#gold)" opacity="0.8"/>
    <polygon points="-15,-14 -13,-18 -17,-18" fill="url(#gold)" opacity="0.8"/>

    <!-- Path/ground -->
    <path d="M -40,45 Q -20,40 0,45 Q 20,50 40,45" fill="none" stroke="#4a3a6a" stroke-width="2"/>
  </g>

  <!-- Card meaning -->
  <text x="70" y="170" text-anchor="middle" fill="#b8a9c9" font-family="Georgia, serif" font-size="7" font-style="italic">Wisdom</text>
  <text x="70" y="180" text-anchor="middle" fill="#b8a9c9" font-family="Georgia, serif" font-size="7" font-style="italic">Guidance</text>

  <!-- Bottom decoration -->
  <text x="70" y="193" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-size="8" opacity="0.6">IX</text>
</svg>
