<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 140 200">
  <defs>
    <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a0a2e"/>
      <stop offset="50%" style="stop-color:#2d1b4e"/>
      <stop offset="100%" style="stop-color:#1a0a2e"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ffd700"/>
      <stop offset="50%" style="stop-color:#ffec80"/>
      <stop offset="100%" style="stop-color:#ffd700"/>
    </linearGradient>
  </defs>

  <!-- Card base -->
  <rect x="2" y="2" width="136" height="196" rx="8" fill="url(#cardBg)" stroke="url(#gold)" stroke-width="2"/>

  <!-- Decorative border -->
  <rect x="8" y="8" width="124" height="184" rx="4" fill="none" stroke="url(#gold)" stroke-width="0.5" opacity="0.5"/>

  <!-- Card title -->
  <text x="70" y="25" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-size="11" font-weight="bold">THE TOWER</text>

  <!-- Roman numeral -->
  <text x="70" y="38" text-anchor="middle" fill="#9370db" font-family="Georgia, serif" font-size="9" opacity="0.8">XVI</text>

  <!-- Main illustration area -->
  <rect x="20" y="45" width="100" height="110" rx="3" fill="#0d0520" stroke="url(#gold)" stroke-width="0.5" opacity="0.8"/>

  <!-- Tower illustration -->
  <g transform="translate(70, 100)">
    <!-- Tower base -->
    <rect x="-15" y="10" width="30" height="45" fill="#4a3060"/>
    <rect x="-18" y="5" width="36" height="10" fill="#5a4070"/>

    <!-- Tower top (crumbling) -->
    <polygon points="-12,-35 0,-50 12,-35" fill="#5a4070"/>
    <rect x="-12" y="-35" width="24" height="40" fill="#4a3060"/>

    <!-- Windows -->
    <rect x="-6" y="-25" width="5" height="8" fill="#ffd700" opacity="0.6"/>
    <rect x="1" y="-25" width="5" height="8" fill="#ffd700" opacity="0.6"/>
    <rect x="-6" y="-10" width="5" height="8" fill="#ffd700" opacity="0.5"/>
    <rect x="1" y="-10" width="5" height="8" fill="#ffd700" opacity="0.5"/>
    <rect x="-3" y="20" width="6" height="12" rx="3" fill="#2a1a40"/>

    <!-- Lightning bolt -->
    <polygon points="25,-40 5,-15 15,-15 -5,20 5,0 -5,0" fill="#ffd700" opacity="0.9"/>

    <!-- Falling debris -->
    <rect x="20" y="-20" width="4" height="4" fill="#5a4070" transform="rotate(30)"/>
    <rect x="-25" y="0" width="3" height="3" fill="#4a3060" transform="rotate(-20)"/>
    <rect x="15" y="15" width="3" height="3" fill="#5a4070" transform="rotate(45)"/>

    <!-- Flames at top -->
    <ellipse cx="-8" cy="-38" rx="4" ry="6" fill="#ff6b35" opacity="0.7"/>
    <ellipse cx="8" cy="-36" rx="3" ry="5" fill="#ff6b35" opacity="0.6"/>
  </g>

  <!-- Card meaning -->
  <text x="70" y="170" text-anchor="middle" fill="#b8a9c9" font-family="Georgia, serif" font-size="7" font-style="italic">Upheaval</text>
  <text x="70" y="180" text-anchor="middle" fill="#b8a9c9" font-family="Georgia, serif" font-size="7" font-style="italic">Revelation</text>

  <!-- Bottom decoration -->
  <text x="70" y="193" text-anchor="middle" fill="url(#gold)" font-family="Georgia, serif" font-size="8" opacity="0.6">XVI</text>
</svg>
