<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- Michi - Bald colleague at whiteboard -->
  <defs>
    <linearGradient id="cardigan" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#7b1fa2"/>
      <stop offset="100%" style="stop-color:#4a148c"/>
    </linearGradient>
    <linearGradient id="headShine" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fce4c7"/>
      <stop offset="40%" style="stop-color:#f5d6ba"/>
      <stop offset="100%" style="stop-color:#e8c4a0"/>
    </linearGradient>
  </defs>
  <!-- Body/Cardigan -->
  <path d="M70 150 Q60 200 55 300 L55 380 L145 380 L145 300 Q140 200 130 150 Z" fill="url(#cardigan)"/>
  <!-- Bald head -->
  <ellipse cx="100" cy="80" rx="40" ry="50" fill="url(#headShine)"/>
  <!-- Subtle head shine highlight -->
  <ellipse cx="90" cy="55" rx="15" ry="10" fill="#fff5e6" opacity="0.4"/>
  <!-- Ears -->
  <ellipse cx="58" cy="85" rx="8" ry="12" fill="#f5d6ba"/>
  <ellipse cx="142" cy="85" rx="8" ry="12" fill="#f5d6ba"/>
  <!-- Focused eyes -->
  <ellipse cx="85" cy="78" rx="5" ry="5" fill="white"/>
  <ellipse cx="115" cy="78" rx="5" ry="5" fill="white"/>
  <ellipse cx="85" cy="79" rx="2.5" ry="2.5" fill="#2d2620"/>
  <ellipse cx="115" cy="79" rx="2.5" ry="2.5" fill="#2d2620"/>
  <!-- Eyebrows -->
  <path d="M78 68 Q85 65 92 68" stroke="#5d4a3a" stroke-width="2" fill="none"/>
  <path d="M108 68 Q115 65 122 68" stroke="#5d4a3a" stroke-width="2" fill="none"/>
  <!-- Nose -->
  <path d="M100 82 L98 95 Q100 98 102 95" stroke="#d4a574" stroke-width="1.5" fill="none"/>
  <!-- Slight smile -->
  <path d="M88 105 Q100 112 112 105" stroke="#8b4513" stroke-width="2" fill="none"/>
  <!-- Arm pointing at whiteboard -->
  <path d="M70 160 Q40 180 50 220" stroke="#f5d6ba" stroke-width="12" fill="none" stroke-linecap="round"/>
  <path d="M130 160 Q180 140 185 120" stroke="#f5d6ba" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Marker in hand -->
  <rect x="180" y="110" width="8" height="25" fill="#e53935" rx="2"/>
</svg>
