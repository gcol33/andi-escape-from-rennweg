<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- Siegrun - Field course instructor, stern but fair -->
  <defs>
    <linearGradient id="siegrunVest" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#8b7355"/>
      <stop offset="100%" style="stop-color:#6b5335"/>
    </linearGradient>
  </defs>
  <!-- Body/Practical Vest over shirt -->
  <path d="M70 150 Q60 200 55 300 L55 380 L145 380 L145 300 Q140 200 130 150 Z" fill="#e8e0d0"/>
  <!-- Vest overlay -->
  <path d="M75 155 Q68 200 65 280 L65 350 L95 350 L95 155 Z" fill="url(#siegrunVest)"/>
  <path d="M125 155 Q132 200 135 280 L135 350 L105 350 L105 155 Z" fill="url(#siegrunVest)"/>
  <!-- Head -->
  <ellipse cx="100" cy="80" rx="38" ry="48" fill="#d8c0a8"/>
  <!-- Hair - practical, grey-streaked -->
  <path d="M60 72 Q58 30 100 24 Q142 30 140 72" fill="#808080"/>
  <path d="M60 72 Q55 95 60 120" stroke="#808080" stroke-width="12" fill="none"/>
  <path d="M140 72 Q145 95 140 120" stroke="#808080" stroke-width="12" fill="none"/>
  <!-- Eyes - sharp, assessing -->
  <ellipse cx="82" cy="72" rx="5" ry="3" fill="#4a4a4a"/>
  <ellipse cx="118" cy="72" rx="5" ry="3" fill="#4a4a4a"/>
  <!-- Slight stern expression -->
  <path d="M88 98 Q100 100 112 98" stroke="#6b4513" stroke-width="2" fill="none"/>
  <!-- Arms - holding field notebook -->
  <path d="M70 160 Q45 200 55 260" stroke="#d8c0a8" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M130 160 Q155 200 145 260" stroke="#d8c0a8" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Field notebook -->
  <rect x="140" y="245" width="25" height="35" fill="#2a4a2a" rx="2"/>
  <line x1="145" y1="255" x2="160" y2="255" stroke="#f5f5dc" stroke-width="1"/>
  <line x1="145" y1="262" x2="160" y2="262" stroke="#f5f5dc" stroke-width="1"/>
  <line x1="145" y1="269" x2="158" y2="269" stroke="#f5f5dc" stroke-width="1"/>
</svg>