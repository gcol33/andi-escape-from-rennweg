<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- CAT Stage 3 - Medium, impossible to ignore -->
  <!-- Body -->
  <ellipse cx="100" cy="320" rx="45" ry="40" fill="#1a1a1a"/>
  <!-- Head -->
  <ellipse cx="100" cy="250" rx="35" ry="32" fill="#1a1a1a"/>
  <!-- Ears -->
  <path d="M72 225 L58 190 L80 218" fill="#1a1a1a"/>
  <path d="M128 225 L142 190 L120 218" fill="#1a1a1a"/>
  <!-- Inner ears -->
  <path d="M72 225 L65 205 L78 220" fill="#2a2a2a"/>
  <path d="M128 225 L135 205 L122 220" fill="#2a2a2a"/>
  <!-- Eyes - glowing intensely -->
  <ellipse cx="85" cy="245" rx="8" ry="10" fill="#ffcc00"/>
  <ellipse cx="115" cy="245" rx="8" ry="10" fill="#ffcc00"/>
  <ellipse cx="85" cy="245" rx="3" ry="8" fill="#111"/>
  <ellipse cx="115" cy="245" rx="3" ry="8" fill="#111"/>
  <!-- Nose -->
  <path d="M100 260 L96 268 L100 270 L104 268 Z" fill="#3a3a3a"/>
  <!-- Whiskers -->
  <line x1="70" y1="265" x2="50" y2="260" stroke="#3a3a3a" stroke-width="1"/>
  <line x1="70" y1="270" x2="48" y2="272" stroke="#3a3a3a" stroke-width="1"/>
  <line x1="130" y1="265" x2="150" y2="260" stroke="#3a3a3a" stroke-width="1"/>
  <line x1="130" y1="270" x2="152" y2="272" stroke="#3a3a3a" stroke-width="1"/>
  <!-- Tail -->
  <path d="M145 320 Q180 300 170 250" stroke="#1a1a1a" stroke-width="12" fill="none" stroke-linecap="round"/>
  <!-- Front paws -->
  <ellipse cx="70" cy="365" rx="15" ry="10" fill="#1a1a1a"/>
  <ellipse cx="130" cy="365" rx="15" ry="10" fill="#1a1a1a"/>
</svg>
