<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- Jen - Squirrel enthusiast -->
  <defs>
    <linearGradient id="jenSweater" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#d4956a"/>
      <stop offset="100%" style="stop-color:#b07850"/>
    </linearGradient>
  </defs>
  <!-- Body/Cozy Sweater -->
  <path d="M70 150 Q60 200 55 300 L55 380 L145 380 L145 300 Q140 200 130 150 Z" fill="url(#jenSweater)"/>
  <!-- Head -->
  <ellipse cx="100" cy="80" rx="38" ry="48" fill="#f0d0b0"/>
  <!-- Hair - messy bun -->
  <path d="M60 70 Q55 30 100 25 Q145 30 140 70" fill="#8b4513"/>
  <circle cx="105" cy="28" r="18" fill="#8b4513"/>
  <circle cx="95" cy="25" r="10" fill="#8b4513"/>
  <!-- Eyes - enthusiastic -->
  <ellipse cx="82" cy="72" rx="6" ry="5" fill="#5a4030"/>
  <ellipse cx="118" cy="72" rx="6" ry="5" fill="#5a4030"/>
  <circle cx="84" cy="70" r="2" fill="white"/>
  <circle cx="120" cy="70" r="2" fill="white"/>
  <!-- Excited smile -->
  <path d="M80 95 Q100 112 120 95" stroke="#8b4513" stroke-width="2" fill="none"/>
  <!-- Arms - one holding bag of nuts -->
  <path d="M70 160 Q40 190 50 250" stroke="#f0d0b0" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M130 160 Q150 180 160 220" stroke="#f0d0b0" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Bag of nuts -->
  <ellipse cx="165" cy="230" rx="18" ry="22" fill="#8b7355"/>
  <ellipse cx="165" cy="215" rx="12" ry="6" fill="#6b5344"/>
  <!-- Squirrel pattern on sweater -->
  <circle cx="100" cy="220" r="15" fill="#c08050" opacity="0.5"/>
  <circle cx="100" cy="210" r="8" fill="#c08050" opacity="0.5"/>
</svg>