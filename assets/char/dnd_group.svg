<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- D&D Group - Three adventurers (Wizard, Rogue, Paladin) -->

  <!-- WIZARD (back left) -->
  <g transform="translate(-20, 20) scale(0.7)">
    <!-- Robe -->
    <path d="M70 180 Q55 250 50 380 L130 380 Q125 250 110 180 Z" fill="#4a0080"/>
    <!-- Head -->
    <ellipse cx="90" cy="130" rx="30" ry="35" fill="#e8c9a0"/>
    <!-- Wizard hat -->
    <path d="M55 130 L90 50 L125 130 Z" fill="#4a0080"/>
    <ellipse cx="90" cy="135" rx="40" ry="10" fill="#3d006b"/>
    <!-- Star on hat -->
    <text x="90" y="100" text-anchor="middle" font-size="20" fill="#ffd700">*</text>
    <!-- Eyes -->
    <circle cx="80" cy="125" r="4" fill="#333"/>
    <circle cx="100" cy="125" r="4" fill="#333"/>
    <!-- Beard -->
    <path d="M70 150 Q90 180 110 150" fill="#aaa"/>
    <!-- Staff -->
    <line x1="130" y1="100" x2="130" y2="350" stroke="#8b4513" stroke-width="5"/>
    <circle cx="130" cy="95" r="12" fill="#00ffff" opacity="0.8"/>
  </g>

  <!-- ROGUE (front center) -->
  <g transform="translate(15, 50) scale(0.75)">
    <!-- Body -->
    <path d="M80 160 Q70 220 65 380 L135 380 Q130 220 120 160 Z" fill="#2a2a2a"/>
    <!-- Head -->
    <ellipse cx="100" cy="110" rx="30" ry="35" fill="#d4a574"/>
    <!-- Hood -->
    <path d="M65 120 Q60 80 100 70 Q140 80 135 120" fill="#1a1a1a"/>
    <!-- Eyes - sneaky -->
    <ellipse cx="88" cy="105" rx="5" ry="3" fill="#333"/>
    <ellipse cx="112" cy="105" rx="5" ry="3" fill="#333"/>
    <!-- Smirk -->
    <path d="M90 125 Q100 130 115 122" stroke="#333" stroke-width="2" fill="none"/>
    <!-- Daggers crossed -->
    <line x1="55" y1="200" x2="75" y2="160" stroke="#c0c0c0" stroke-width="3"/>
    <line x1="145" y1="200" x2="125" y2="160" stroke="#c0c0c0" stroke-width="3"/>
  </g>

  <!-- PALADIN (back right) -->
  <g transform="translate(45, 15) scale(0.7)">
    <!-- Armor body -->
    <path d="M75 180 Q65 250 60 380 L140 380 Q135 250 125 180 Z" fill="#c0c0c0"/>
    <!-- Shoulder pads -->
    <ellipse cx="70" cy="185" rx="20" ry="12" fill="#ffd700"/>
    <ellipse cx="130" cy="185" rx="20" ry="12" fill="#ffd700"/>
    <!-- Head -->
    <ellipse cx="100" cy="130" rx="30" ry="35" fill="#e8c9a0"/>
    <!-- Helmet -->
    <path d="M65 130 Q65 90 100 85 Q135 90 135 130 Q120 120 100 120 Q80 120 65 130" fill="#c0c0c0"/>
    <!-- Helmet visor -->
    <rect x="75" y="115" width="50" height="8" fill="#333"/>
    <!-- Cross on chest -->
    <line x1="100" y1="200" x2="100" y2="260" stroke="#ffd700" stroke-width="6"/>
    <line x1="80" y1="230" x2="120" y2="230" stroke="#ffd700" stroke-width="6"/>
    <!-- Sword -->
    <line x1="145" y1="150" x2="155" y2="320" stroke="#c0c0c0" stroke-width="4"/>
    <line x1="140" y1="155" x2="160" y2="155" stroke="#ffd700" stroke-width="4"/>
  </g>

  <!-- Label -->
  <text x="100" y="395" text-anchor="middle" font-size="11" fill="#666">D&D GROUP</text>
</svg>
