<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- JOHANNES - Nerdy mathematician, pi-day enthusiast -->
  <!-- Body - button-up shirt -->
  <ellipse cx="100" cy="320" rx="35" ry="45" fill="#4a6fa5"/>
  <!-- Shirt collar -->
  <path d="M85 280 L100 295 L115 280" fill="#ffffff" stroke="#4a6fa5" stroke-width="1"/>
  <!-- Head -->
  <ellipse cx="100" cy="240" rx="28" ry="32" fill="#e8d4b8"/>
  <!-- Hair - neat, parted -->
  <path d="M72 225 Q72 200 100 195 Q128 200 128 225 L125 230 Q100 220 75 230 Z" fill="#5c4033"/>
  <!-- Glasses - thick rimmed -->
  <ellipse cx="88" cy="238" rx="12" ry="10" fill="none" stroke="#333" stroke-width="3"/>
  <ellipse cx="112" cy="238" rx="12" ry="10" fill="none" stroke="#333" stroke-width="3"/>
  <line x1="100" y1="238" x2="100" y2="238" stroke="#333" stroke-width="3"/>
  <line x1="76" y1="235" x2="72" y2="230" stroke="#333" stroke-width="2"/>
  <line x1="124" y1="235" x2="128" y2="230" stroke="#333" stroke-width="2"/>
  <!-- Eyes behind glasses -->
  <ellipse cx="88" cy="240" rx="3" ry="4" fill="#4a3728"/>
  <ellipse cx="112" cy="240" rx="3" ry="4" fill="#4a3728"/>
  <!-- Slight smile -->
  <path d="M92 258 Q100 264 108 258" stroke="#8b7355" stroke-width="2" fill="none"/>
  <!-- Pocket with pens -->
  <rect x="80" y="295" width="15" height="20" fill="#3d5a80" stroke="#2c4a6e"/>
  <line x1="84" y1="295" x2="84" y2="288" stroke="#333" stroke-width="2"/>
  <line x1="88" y1="295" x2="88" y2="286" stroke="#cc0000" stroke-width="2"/>
  <!-- Pi symbol on shirt -->
  <text x="105" y="320" font-family="serif" font-size="24" fill="#ffffff" opacity="0.8">π</text>
  <!-- Arms -->
  <ellipse cx="60" cy="320" rx="12" ry="25" fill="#4a6fa5"/>
  <ellipse cx="140" cy="320" rx="12" ry="25" fill="#4a6fa5"/>
  <!-- Hands -->
  <ellipse cx="60" cy="350" rx="8" ry="10" fill="#e8d4b8"/>
  <ellipse cx="140" cy="350" rx="8" ry="10" fill="#e8d4b8"/>
  <!-- Legs -->
  <rect x="78" y="360" width="18" height="35" fill="#3d3d3d"/>
  <rect x="104" y="360" width="18" height="35" fill="#3d3d3d"/>
  <!-- Shoes -->
  <ellipse cx="87" cy="398" rx="12" ry="6" fill="#1a1a1a"/>
  <ellipse cx="113" cy="398" rx="12" ry="6" fill="#1a1a1a"/>
</svg>
