<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- CAT Stage 1 - Small but visible -->
  <!-- Body -->
  <ellipse cx="100" cy="345" rx="20" ry="16" fill="#1a1a1a"/>
  <!-- Head -->
  <ellipse cx="100" cy="318" rx="14" ry="13" fill="#1a1a1a"/>
  <!-- Ears -->
  <path d="M89 308 L83 294 L92 305" fill="#1a1a1a"/>
  <path d="M111 308 L117 294 L108 305" fill="#1a1a1a"/>
  <!-- Inner ears -->
  <path d="M89 307 L86 298 L91 305" fill="#2a2a2a"/>
  <path d="M111 307 L114 298 L109 305" fill="#2a2a2a"/>
  <!-- Eyes - glowing -->
  <ellipse cx="94" cy="316" rx="3" ry="4" fill="#ffcc00"/>
  <ellipse cx="106" cy="316" rx="3" ry="4" fill="#ffcc00"/>
  <ellipse cx="94" cy="316" rx="1.2" ry="3" fill="#111"/>
  <ellipse cx="106" cy="316" rx="1.2" ry="3" fill="#111"/>
  <!-- Eye glow -->
  <ellipse cx="94" cy="316" rx="4" ry="5" fill="none" stroke="#ffcc00" stroke-width="1" opacity="0.3"/>
  <ellipse cx="106" cy="316" rx="4" ry="5" fill="none" stroke="#ffcc00" stroke-width="1" opacity="0.3"/>
  <!-- Nose -->
  <path d="M100 322 L98 326 L100 327 L102 326 Z" fill="#3a3a3a"/>
  <!-- Whiskers -->
  <line x1="88" y1="324" x2="75" y2="322" stroke="#3a3a3a" stroke-width="0.5"/>
  <line x1="88" y1="327" x2="74" y2="330" stroke="#3a3a3a" stroke-width="0.5"/>
  <line x1="112" y1="324" x2="125" y2="322" stroke="#3a3a3a" stroke-width="0.5"/>
  <line x1="112" y1="327" x2="126" y2="330" stroke="#3a3a3a" stroke-width="0.5"/>
  <!-- Tail -->
  <path d="M120 345 Q138 338 132 318" stroke="#1a1a1a" stroke-width="5" fill="none" stroke-linecap="round"/>
  <!-- Front paws -->
  <ellipse cx="90" cy="362" rx="8" ry="5" fill="#1a1a1a"/>
  <ellipse cx="110" cy="362" rx="8" ry="5" fill="#1a1a1a"/>
</svg>
