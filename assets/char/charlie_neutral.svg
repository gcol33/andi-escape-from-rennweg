<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- Charlie - Colleague, Neutral/Helpful -->
  <defs>
    <linearGradient id="shirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a6fa5"/>
      <stop offset="100%" style="stop-color:#3d5a80"/>
    </linearGradient>
  </defs>
  <!-- Body/Button-up shirt -->
  <path d="M70 150 Q60 200 55 300 L55 380 L145 380 L145 300 Q140 200 130 150 Z" fill="url(#shirt)"/>
  <!-- Collar -->
  <path d="M80 148 L100 165 L120 148" stroke="#3d5a80" stroke-width="3" fill="none"/>
  <!-- Button line -->
  <line x1="100" y1="165" x2="100" y2="340" stroke="#3d5a80" stroke-width="2"/>
  <circle cx="100" cy="185" r="3" fill="#e0e0e0"/>
  <circle cx="100" cy="220" r="3" fill="#e0e0e0"/>
  <circle cx="100" cy="255" r="3" fill="#e0e0e0"/>
  <!-- Head -->
  <ellipse cx="100" cy="80" rx="38" ry="48" fill="#e8beac"/>
  <!-- Short neat hair -->
  <path d="M62 65 Q55 25 100 18 Q145 25 138 65 Q130 50 100 45 Q70 50 62 65" fill="#4a3728"/>
  <!-- Eyes - friendly but neutral -->
  <ellipse cx="85" cy="75" rx="5" ry="5" fill="white"/>
  <ellipse cx="115" cy="75" rx="5" ry="5" fill="white"/>
  <ellipse cx="85" cy="76" rx="3" ry="3" fill="#3d2314"/>
  <ellipse cx="115" cy="76" rx="3" ry="3" fill="#3d2314"/>
  <!-- Eyebrows - slightly raised -->
  <path d="M77 66 Q85 64 93 67" stroke="#4a3728" stroke-width="2" fill="none"/>
  <path d="M107 67 Q115 64 123 66" stroke="#4a3728" stroke-width="2" fill="none"/>
  <!-- Neutral friendly mouth -->
  <path d="M85 98 Q100 102 115 98" stroke="#8b5a4a" stroke-width="2" fill="none"/>
  <!-- Arms at sides -->
  <path d="M70 160 Q50 200 45 260" stroke="#e8beac" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M130 160 Q150 200 155 260" stroke="#e8beac" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Shirt sleeves -->
  <path d="M70 160 Q55 180 50 200" stroke="#4a6fa5" stroke-width="16" fill="none" stroke-linecap="round"/>
  <path d="M130 160 Q145 180 150 200" stroke="#4a6fa5" stroke-width="16" fill="none" stroke-linecap="round"/>
</svg>
