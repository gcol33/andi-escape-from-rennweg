<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- CAT Stage 4 - Large, dominating presence -->
  <!-- Body - fills lower half -->
  <ellipse cx="100" cy="300" rx="70" ry="60" fill="#1a1a1a"/>
  <!-- Head - large and looming -->
  <ellipse cx="100" cy="180" rx="55" ry="50" fill="#1a1a1a"/>
  <!-- Ears - tall -->
  <path d="M55 145 L35 80 L70 130" fill="#1a1a1a"/>
  <path d="M145 145 L165 80 L130 130" fill="#1a1a1a"/>
  <!-- Inner ears -->
  <path d="M55 140 L45 100 L65 130" fill="#2a2a2a"/>
  <path d="M145 140 L155 100 L135 130" fill="#2a2a2a"/>
  <!-- Eyes - huge and unsettling -->
  <ellipse cx="75" cy="170" rx="15" ry="18" fill="#ffcc00"/>
  <ellipse cx="125" cy="170" rx="15" ry="18" fill="#ffcc00"/>
  <ellipse cx="75" cy="170" rx="5" ry="15" fill="#111"/>
  <ellipse cx="125" cy="170" rx="5" ry="15" fill="#111"/>
  <!-- Eye glow effect -->
  <ellipse cx="75" cy="170" rx="18" ry="21" fill="none" stroke="#ffcc00" stroke-width="2" opacity="0.3"/>
  <ellipse cx="125" cy="170" rx="18" ry="21" fill="none" stroke="#ffcc00" stroke-width="2" opacity="0.3"/>
  <!-- Nose -->
  <path d="M100 195 L92 210 L100 215 L108 210 Z" fill="#3a3a3a"/>
  <!-- Mouth -->
  <path d="M92 220 Q100 230 108 220" stroke="#3a3a3a" stroke-width="2" fill="none"/>
  <!-- Whiskers -->
  <line x1="60" y1="205" x2="25" y2="195" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="58" y1="215" x2="20" y2="220" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="56" y1="225" x2="22" y2="240" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="140" y1="205" x2="175" y2="195" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="142" y1="215" x2="180" y2="220" stroke="#3a3a3a" stroke-width="2"/>
  <line x1="144" y1="225" x2="178" y2="240" stroke="#3a3a3a" stroke-width="2"/>
  <!-- Tail - wrapping around -->
  <path d="M170 300 Q200 260 185 200 Q175 160 190 120" stroke="#1a1a1a" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Front paws -->
  <ellipse cx="50" cy="370" rx="25" ry="15" fill="#1a1a1a"/>
  <ellipse cx="150" cy="370" rx="25" ry="15" fill="#1a1a1a"/>
</svg>
