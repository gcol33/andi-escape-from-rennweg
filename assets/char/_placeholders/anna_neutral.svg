<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- Anna - Mushroom tea experimenter, Neutral pose -->
  <defs>
    <linearGradient id="labcoat" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f5f5"/>
      <stop offset="100%" style="stop-color:#e0e0e0"/>
    </linearGradient>
  </defs>
  <!-- Body/Lab coat -->
  <path d="M70 150 Q60 200 55 300 L55 380 L145 380 L145 300 Q140 200 130 150 Z" fill="url(#labcoat)"/>
  <!-- Lab coat lapels -->
  <path d="M70 150 L90 200 L90 150" fill="#4a7c59"/>
  <path d="M130 150 L110 200 L110 150" fill="#4a7c59"/>
  <!-- Head -->
  <ellipse cx="100" cy="80" rx="40" ry="50" fill="#e8c9a0"/>
  <!-- Hair - wavy brown -->
  <path d="M55 80 Q50 40 75 30 Q100 20 125 30 Q150 40 145 80 Q140 60 120 50 Q100 45 80 50 Q60 60 55 80" fill="#6b4423"/>
  <!-- Wavy hair strands -->
  <path d="M55 80 Q50 100 55 120" stroke="#6b4423" stroke-width="8" fill="none"/>
  <path d="M145 80 Q150 100 145 120" stroke="#6b4423" stroke-width="8" fill="none"/>
  <!-- Eyes - curious look -->
  <ellipse cx="85" cy="75" rx="6" ry="5" fill="#2d5016"/>
  <ellipse cx="115" cy="75" rx="6" ry="5" fill="#2d5016"/>
  <circle cx="86" cy="74" r="2" fill="#fff"/>
  <circle cx="116" cy="74" r="2" fill="#fff"/>
  <!-- Eyebrows - raised/curious -->
  <path d="M78 65 Q85 62 92 65" stroke="#4a3728" stroke-width="2" fill="none"/>
  <path d="M108 65 Q115 62 122 65" stroke="#4a3728" stroke-width="2" fill="none"/>
  <!-- Slight smile -->
  <path d="M88 98 Q100 105 112 98" stroke="#a0522d" stroke-width="2" fill="none"/>
  <!-- Arms -->
  <path d="M70 160 Q45 200 55 260" stroke="#e8c9a0" stroke-width="15" fill="none" stroke-linecap="round"/>
  <path d="M130 160 Q155 200 145 260" stroke="#e8c9a0" stroke-width="15" fill="none" stroke-linecap="round"/>
  <!-- Sleeves -->
  <path d="M70 160 Q45 200 55 220" stroke="#f5f5f5" stroke-width="18" fill="none" stroke-linecap="round"/>
  <path d="M130 160 Q155 200 145 220" stroke="#f5f5f5" stroke-width="18" fill="none" stroke-linecap="round"/>
  <!-- Mug in hand -->
  <ellipse cx="50" cy="265" rx="15" ry="20" fill="#8fbc8f"/>
  <ellipse cx="50" cy="250" rx="12" ry="5" fill="#556b2f"/>
  <!-- Steam from mug -->
  <path d="M45 240 Q40 230 45 220" stroke="#90ee90" stroke-width="2" fill="none" opacity="0.6"/>
  <path d="M55 240 Q60 230 55 220" stroke="#90ee90" stroke-width="2" fill="none" opacity="0.6"/>
  <!-- Label -->
  <text x="100" y="395" text-anchor="middle" font-size="12" fill="#666">ANNA</text>
</svg>
