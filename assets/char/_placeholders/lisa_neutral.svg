  <path d="M75 65 Q82 62 90 65" stroke="#1a1a1a" stroke-width="2" fill="none"/>
  <!-- Slight nervous smile -->
  <path d="M85 98 Q100 103 115 98" stroke="#8b4513" stroke-width="2" fill="none"/>
  <!-- Arms - one gesturing -->
  <path d="M70 160 Q45 200 50 260" stroke="#e0c0a0" stroke-width="14" fill="none" stroke-linecap="round"/>
  <path d="M130 160 Q165 175 175 210" stroke="#e0c0a0" stroke-width="14" fill="none" stroke-linecap="round"/>
  <!-- Coffee cup -->
  <rect x="40" y="245" width="20" height="25" fill="#f5f5f5" rx="2"/>
  <ellipse cx="50" cy="245" rx="10" ry="3" fill="#f5f5f5"/>
  <path d="M60 250 Q70 255 60 265" stroke="#f5f5f5" stroke-width="3" fill="none"/>
</svg>