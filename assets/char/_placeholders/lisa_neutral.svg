<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- Lisa - Kitchen encounter, mouse story -->
  <defs>
    <linearGradient id="lisaBlouse" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#c75050"/>
      <stop offset="100%" style="stop-color:#a03030"/>
    </linearGradient>
  </defs>
  <!-- Body/Red Blouse -->
  <path d="M70 150 Q60 200 55 300 L55 380 L145 380 L145 300 Q140 200 130 150 Z" fill="url(#lisaBlouse)"/>
