<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- Didi - Sci-fi enthusiast -->
  <defs>
    <linearGradient id="didiShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2a2a3a"/>
      <stop offset="100%" style="stop-color:#1a1a2a"/>
    </linearGradient>
  </defs>
  <!-- Body/Dark Shirt -->
  <path d="M70 150 Q60 200 55 300 L55 380 L145 380 L145 300 Q140 200 130 150 Z" fill="url(#didiShirt)"/>
  <!-- Head -->
  <ellipse cx="100" cy="80" rx="40" ry="50" fill="#d4a574"/>
  <!-- Hair - slightly messy -->
  <path d="M58 70 Q55 25 100 20 Q145 25 142 70 Q135 45 100 42 Q65 45 58 70" fill="#4a3728"/>
  <!-- Glasses -->
  <rect x="68" y="65" width="25" height="18" rx="3" stroke="#333" stroke-width="2" fill="none"/>
  <rect x="107" y="65" width="25" height="18" rx="3" stroke="#333" stroke-width="2" fill="none"/>
  <line x1="93" y1="74" x2="107" y2="74" stroke="#333" stroke-width="2"/>
  <!-- Eyes behind glasses -->
  <ellipse cx="80" cy="74" rx="4" ry="3" fill="#2d2620"/>
  <ellipse cx="120" cy="74" rx="4" ry="3" fill="#2d2620"/>
  <!-- Slight smile -->
  <path d="M88 98 Q100 104 112 98" stroke="#8b4513" stroke-width="2" fill="none"/>
  <!-- Arms - one hand up gesturing -->
  <path d="M70 160 Q50 200 55 260" stroke="#d4a574" stroke-width="15" fill="none" stroke-linecap="round"/>
  <path d="M130 160 Q160 170 170 200" stroke="#d4a574" stroke-width="15" fill="none" stroke-linecap="round"/>
  <!-- Book in hand -->
  <rect x="160" y="185" width="30" height="40" fill="#8b0000" rx="2"/>
  <text x="175" y="210" text-anchor="middle" font-size="6" fill="#ffd700">EXP</text>
</svg>