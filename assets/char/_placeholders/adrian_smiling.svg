<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 400" width="200" height="400">
  <!-- Adrian - Always Smiling Guy -->
  <defs>
    <linearGradient id="adrianShirt" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a90d9"/>
      <stop offset="100%" style="stop-color:#2d5aa0"/>
    </linearGradient>
  </defs>
  <!-- Body/Casual Shirt -->
  <path d="M70 150 Q60 200 55 300 L55 380 L145 380 L145 300 Q140 200 130 150 Z" fill="url(#adrianShirt)"/>
  <!-- Head -->
  <ellipse cx="100" cy="80" rx="40" ry="50" fill="#e8c4a0"/>
  <!-- Hair - short and neat -->
  <path d="M60 65 Q60 30 100 25 Q140 30 140 65 Q130 40 100 38 Q70 40 60 65" fill="#5c4033"/>
  <!-- Eyes - friendly -->
  <ellipse cx="82" cy="72" rx="6" ry="5" fill="#2d2620"/>
  <ellipse cx="118" cy="72" rx="6" ry="5" fill="#2d2620"/>
  <!-- Eye sparkle -->
  <circle cx="84" cy="70" r="2" fill="white"/>
  <circle cx="120" cy="70" r="2" fill="white"/>
  <!-- Big Smile -->
  <path d="M78 95 Q100 115 122 95" stroke="#8b4513" stroke-width="3" fill="none"/>
  <!-- Teeth showing -->
  <path d="M82 97 Q100 108 118 97" fill="white"/>
  <!-- Arms - open welcoming gesture -->
  <path d="M70 160 Q30 180 40 230" stroke="#e8c4a0" stroke-width="15" fill="none" stroke-linecap="round"/>
  <path d="M130 160 Q170 180 160 230" stroke="#e8c4a0" stroke-width="15" fill="none" stroke-linecap="round"/>
  <!-- Collar -->
  <path d="M85 148 L100 165 L115 148" stroke="#2d5aa0" stroke-width="3" fill="none"/>
</svg>